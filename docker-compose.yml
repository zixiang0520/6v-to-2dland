# 金山文档百度网盘链接搜索 —— Docker Compose 示例
# 使用：docker compose up -d
services:
  kdocs-baiduyun:
    build: .
    image: kdocs-baiduyun:latest
    container_name: kdocs-baiduyun
    restart: unless-stopped
    ports:
      # 宿主端口可用 .env 的 HOST_PORT 覆盖（默认 8080），如生产用 28080
      - "${HOST_PORT:-8080}:8080"
    volumes:
      # config.json 持久化目录
      - ./data:/app/data
