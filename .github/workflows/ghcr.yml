name: Publish to GHCR

# 触发条件：推送 main 分支、打 v* 标签、手动触发
# 注意：pull_request 不触发，避免 PR 产生镜像
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 推送到 GHCR 需要 packages: write 权限（自动使用 GITHUB_TOKEN，无需额外 PAT）
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # github.repository 形如 owner/repo；metadata-action 会自动转为小写
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build & push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tags & labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 标签策略：
          #   main 分支 → latest + sha-xxxxxxx（追踪最新构建）
          #   tag v1.2.3 → 1.2.3 / 1.2 / 1（语义化版本）
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=6v-to-2dland
            org.opencontainers.image.description=6v520 → 2dland 离线下载助手
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build & push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job summary
        run: |
          {
            echo "### 🐳 镜像已推送至 GHCR"
            echo ""
            echo "拉取镜像："
            echo '```bash'
            echo "docker pull ghcr.io/${IMAGE,,}:latest"
            echo '```'
            echo ""
            echo "**本次标签：**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
