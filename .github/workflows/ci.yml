name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Go 单元测试 + vet + 多平台交叉编译
  # ---------------------------------------------------------------------------
  build-test:
    name: Go test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -v

      - name: Build (linux/amd64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" -o dist/6v-to-2dland-linux-amd64 .

      - uses: actions/upload-artifact@v4
        with:
          name: 6v-to-2dland-linux-amd64
          path: dist/6v-to-2dland-linux-amd64
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Docker 镜像构建 —— 验证 Dockerfile 在真实 Linux 环境可用
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: 6v-to-2dland:ci

      - name: Inspect image size
        run: docker images 6v-to-2dland:ci --format "size={{.Size}}"

      - name: Smoke test — 容器可启动并监听 8080
        run: |
          docker run -d --name smoke -p 18080:8080 6v-to-2dland:ci
          sleep 3
          # 无 config.json 时应以默认配置启动并监听 :8080，health 端点应 200
          curl -fsS http://127.0.0.1:18080/api/health || (docker logs smoke; exit 1)
          docker logs smoke
          docker rm -f smoke
